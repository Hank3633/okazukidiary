<!DOCTYPE html>
<html lang="zh-Hant" data-canvas-width="400" data-canvas-height="872">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>銀行管理主頁</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { font-family:'Segoe UI','PingFang TC','Microsoft JhengHei',Roboto,sans-serif; }
  .phone { width:400px; background:#000; border-radius:40px; padding:12px; margin:0 auto; }
  .screen { width:376px; height:848px; background:#F2F2F2; border-radius:30px; overflow:hidden; position:relative; }
  .statusbar { height:26px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 18px; font-size:12px; font-weight:600; color:#1c1c1e; }
  .statusbar .right { display:flex; gap:6px; align-items:center; }
  .appbar { height:52px; background:#fff; display:flex; align-items:center; justify-content:center; position:relative; border-bottom:1px solid #f0f0f0; }
  .appbar .title { font-size:18px; font-weight:600; color:#1c1c1e; letter-spacing:.3px; }
  .appbar .act { position:absolute; right:10px; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:3px; color:#26C6A0; font-size:13px; font-weight:600; }
  .body { padding:12px 14px 10px; }
  .summary { border-radius:18px; padding:16px 18px; color:#fff; background:linear-gradient(135deg,#2ad6ad 0%,#1f9e83 55%,#17856f 100%); box-shadow:0 8px 20px rgba(38,198,160,.30); }
  .summary .label { font-size:12px; letter-spacing:1px; opacity:.85; display:flex; align-items:center; gap:6px; }
  .summary .amount { font-size:30px; font-weight:800; margin-top:4px; letter-spacing:.4px; }
  .summary .row { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .pill { background:rgba(255,255,255,.22); border-radius:20px; padding:3px 10px; font-size:11px; display:flex; align-items:center; gap:4px; }
  .summary .sub { font-size:11px; opacity:.8; margin-left:auto; }
  .acct { background:#fff; border-radius:16px; padding:10px 14px 4px; margin-top:10px; box-shadow:0 1px 2px rgba(20,40,35,.06); }
  .toprow { display:flex; align-items:center; padding:2px 0; }
  .avatar { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
  .mid { margin-left:11px; flex:1; min-width:0; }
  .name { font-size:15px; font-weight:600; color:#1c1c1e; display:flex; align-items:center; gap:5px; }
  .name .edit { color:#b0b0b0; display:flex; }
  .orig { font-size:11.5px; color:#8a8a8a; margin-top:2px; }
  .bal { text-align:right; }
  .bal .val { font-size:16px; font-weight:800; color:#2e9e5b; letter-spacing:.3px; }
  .bal .tag { font-size:10px; color:#b0b0b0; margin-top:1px; }
  .del { color:#c0c0c0; display:flex; margin-left:4px; }
  .balinput { margin:6px 8px 0 0; border-bottom:1px solid #e4e7e6; padding:4px 0; font-size:13px; color:#8a8a8a; }
  .detail { display:flex; align-items:center; justify-content:flex-end; gap:2px; color:#26C6A0; font-size:12px; font-weight:600; padding:4px 8px 4px 0; }
  .add { background:#fff; border-radius:16px; padding:14px; margin-top:12px; box-shadow:0 1px 2px rgba(20,40,35,.06); }
  .add .tt { font-size:13px; font-weight:600; color:#333; display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .add .field { border:1px solid #e4e7e6; border-radius:12px; padding:11px 12px; font-size:13px; color:#9aa5a0; background:#f7faf9; }
  .add .btn { margin-top:10px; background:#26c6a0; color:#fff; border:none; border-radius:12px; height:44px; font-size:15px; font-weight:600; width:100%; letter-spacing:.4px; text-align:center; line-height:44px; }
  .bottombar { position:absolute; left:0; right:0; bottom:0; height:60px; background:#fff; display:flex; border-top:1px solid #f0f0f0; }
  .navitem { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:#9a9a9a; font-size:10px; }
  .navitem.active { color:#26c6a0; }
  .navitem svg { width:22px; height:22px; }
</style>
</head>
<body>
