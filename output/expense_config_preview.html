<!DOCTYPE html>
<html lang="zh-Hant" data-canvas-width="400" data-canvas-height="872">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支出頁 日期/付款方式 美化預覽</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { font-family:'Segoe UI','PingFang TC','Microsoft JhengHei',Roboto,sans-serif; }
  .phone { width:400px; background:#000; border-radius:40px; padding:12px; margin:0 auto; }
  .screen { width:376px; height:848px; background:#F2F2F2; border-radius:30px; overflow:hidden; position:relative; }
  .statusbar { height:26px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 18px; font-size:12px; font-weight:600; color:#1c1c1e; }
  .statusbar .right { display:flex; gap:6px; align-items:center; }
  .body { height:calc(100% - 60px); overflow:hidden; display:flex; flex-direction:column; }

  /* category grid card */
  .cats { margin:12px 12px 6px; padding:8px; background:#fff; border-radius:16px; box-shadow:0 1px 6px rgba(0,0,0,.04); }
  .catgrid { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .cat { padding:8px 2px 6px; border-radius:12px; display:flex; flex-direction:column; align-items:center; gap:4px; border:2px solid transparent; }
  .cat.sel { background:#E3F2FD; border-color:#64B5F6; }
  .cat .ico { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; }
  .cat .lb { font-size:11px; color:#000000dd; }

  /* input card */
  .input { margin:6px 12px 0; flex:1; background:#fff; border-radius:16px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 2px 10px rgba(0,0,0,.06); }

  /* beautified config bar */
  .bar { display:flex; align-items:center; padding:12px 14px; border-bottom:1px solid #f0f0f0; background:#fff; }
  .pill { display:flex; align-items:center; background:#F1F4F3; border:1px solid #E3E8E6; border-radius:20px; overflow:hidden; }
  .seg { display:flex; align-items:center; gap:6px; padding:8px 12px; }
  .seg .ico { width:16px; height:16px; color:#26C6A0; }
  .seg .tx { font-size:13px; color:#1C1C1E; font-weight:500; }
  .seg .hint { font-size:13px; color:#9AA5A0; }
  .seg .ch { width:15px; height:15px; color:#9AA5A0; }
  .vd { width:1px; height:20px; background:#E3E8E6; }
  .spacer { flex:1; }
  .amt { font-size:24px; font-weight:800; color:#1C1C1E; min-width:56px; text-align:right; }

  /* keypad */
  .key { flex:1; padding:8px; display:grid; grid-template-rows:repeat(4,1fr); gap:8px; }
  .krow { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .kb { border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:500; color:#000000dd; background:#F7F7F7; box-shadow:0 2px 4px rgba(0,0,0,.08); }
  .kb.op { background:#E3F2FD; color:#1976D2; font-weight:700; }
  .kb.ac { background:#FFEBEE; color:#E53935; font-weight:700; }
  .kb.eq { background:#F5F5F5; color:#000000aa; }
  .kb.ok { background:#B4E600; color:#000000dd; font-weight:700; }

  /* bottom nav */
  .bottombar { position:absolute; left:0; right:0; bottom:0; height:60px; background:#fff; display:flex; border-top:1px solid #f0f0f0; }
  .navitem { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:#9a9a9a; font-size:10px; }
  .navitem.active { color:#26C6A0; }
  .navitem svg { width:22px; height:22px; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="statusbar">
      <span>9:41</span>
      <span class="right">
        <svg width="16" height="12" viewBox="0 0 24 12" fill="#1c1c1e"><rect x="1" y="7" width="4" height="4" rx="1"/><rect x="6.5" y="4.5" width="4" height="6.5" rx="1"/><rect x="12" y="2" width="4" height="9" rx="1"/><rect x="17.5" y="0" width="4" height="11" rx="1"/></svg>
        <svg width="20" height="12" viewBox="0 0 24 12" fill="none" stroke="#1c1c1e" stroke-width="1.6"><rect x="0.8" y="0.8" width="20.4" height="10.4" rx="3"/><rect x="22" y="4" width="2" height="4" rx="1" fill="#1c1c1e"/></svg>
        <svg width="14" height="12" viewBox="0 0 24 12" fill="#1c1c1e"><path d="M14 4c0-2.2-1.8-4-4-4H4v16h6c2.2 0 4-1.8 4-4 0-1.1-.4-2-1-2.7.6-.7 1-1.6 1-2.7z"/></svg>
      </span>
    </div>

    <div class="body">
      <!-- category grid -->
      <div class="cats">
        <div class="catgrid">
          <div class="cat sel"><div class="ico" style="background:#4FC3F7;">🍽</div><div class="lb">餐點</div></div>
          <div class="cat"><div class="ico" style="background:#FF7043;">🥤</div><div class="lb">飲料</div></div>
          <div class="cat"><div class="ico" style="background:#81C784;">🍎</div><div class="lb">水果</div></div>
          <div class="cat"><div class="ico" style="background:#EF5350;">🏠</div><div class="lb">住宿</div></div>
          <div class="cat"><div class="ico" style="background:#4DD0E1;">🚌</div><div class="lb">交通</div></div>
          <div class="cat"><div class="ico" style="background:#7986CB;">👕</div><div class="lb">衣服</div></div>
          <div class="cat"><div class="ico" style="background:#FFCA28;">💡</div><div class="lb">電費</div></div>
          <div class="cat"><div class="ico" style="background:#4FC3F7;">💧</div><div class="lb">水費</div></div>
          <div class="cat"><div class="ico" style="background:#FF7043;">🔥</div><div class="lb">瓦斯費</div></div>
          <div class="cat"><div class="ico" style="background:#66BB6A;">🔌</div><div class="lb">家電</div></div>
        </div>
      </div>

      <!-- input card -->
      <div class="input">
        <!-- beautified date / payment config bar -->
        <div class="bar">
          <div class="pill">
            <div class="seg">
              <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
              <span class="tx">10/04</span>
              <svg class="ch" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
            </div>
            <div class="vd"></div>
            <div class="seg">
              <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M21 7H3c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm0 12H3v-5h4c0 1.66 1.34 3 3 3s3-1.34 3-3h8v5zm0-7h-8c0 1.66-1.34 3-3 3s-3-1.34-3-3H3V9h18v3z"/></svg>
              <span class="tx">現金帳戶</span>
              <svg class="ch" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
            </div>
          </div>
          <div class="spacer"></div>
          <div class="amt">0</div>
        </div>

        <!-- keypad -->
        <div class="key">
          <div class="krow">
            <div class="kb">7</div><div class="kb">8</div><div class="kb">9</div>
            <div class="kb op">+</div><div class="kb ac">AC</div>
          </div>
          <div class="krow">
            <div class="kb">4</div><div class="kb">5</div><div class="kb">6</div>
            <div class="kb op">−</div><div class="kb">⌫</div>
          </div>
          <div class="krow">
            <div class="kb">1</div><div class="kb">2</div><div class="kb">3</div>
            <div class="kb op">×</div><div class="kb eq">=</div>
          </div>
          <div class="krow">
            <div class="kb">0</div><div class="kb">00</div><div class="kb">.</div>
            <div class="kb op">÷</div><div class="kb ok">OK</div>
          </div>
        </div>
      </div>
    </div>

    <!-- bottom nav -->
    <div class="bottombar">
      <div class="navitem active"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>支出</div>
      <div class="navitem"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>收入</div>
      <div class="navitem"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zM16.2 13h2.8v6h-2.8z"/></svg>收支統計</div>
      <div class="navitem"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 10h3v7H4v-7zm6 0h3v7h-3v-7zm6 0h3v7h-3v-7zM4 19h16v2H4v-2zM13 3.5 21 6v2H3V6l10-2.5z"/></svg>銀行管理</div>
      <div class="navitem"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>圖標</div>
    </div>
  </div>
</div>
</body>
</html>
