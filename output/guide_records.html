<!DOCTYPE html>
<html lang="zh-Hant" data-canvas-width="400" data-canvas-height="872">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收支統計紀錄清單</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { font-family:'Segoe UI','PingFang TC','Microsoft JhengHei',Roboto,sans-serif; }
  .phone { width:400px; background:#000; border-radius:40px; padding:12px; margin:0 auto; }
  .screen { width:376px; height:848px; background:#F2F2F2; border-radius:30px; overflow:hidden; position:relative; }
  .statusbar { height:26px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 18px; font-size:12px; font-weight:600; color:#1c1c1e; }
  .appbar { background:#fff; border-bottom:1px solid #f0f0f0; }
  .appbar .tt { height:52px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:600; color:#1c1c1e; }
  .tabs { display:flex; }
  .tab { flex:1; text-align:center; padding:10px 0; font-size:14px; color:#666; border-bottom:2px solid transparent; }
  .tab.on { color:#26c6a0; font-weight:600; border-bottom-color:#26c6a0; }
  .seg { margin:12px; display:flex; background:#eef2f0; border-radius:12px; padding:3px; }
  .seg .s { flex:1; text-align:center; padding:8px 0; font-size:13px; border-radius:10px; color:#6b6b6b; }
  .seg .s.on { background:#fff; color:#26c6a0; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .range { display:flex; align-items:center; justify-content:center; gap:8px; color:#26c6a0; font-size:13px; padding:0 12px 8px; }
  .range .rm { color:#666; font-size:13px; }
  .row { display:flex; align-items:center; background:#fff; padding:12px 14px; border-bottom:1px solid #f3f3f3; }
  .ci { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .m { margin-left:12px; flex:1; }
  .m .t { font-size:14px; font-weight:600; color:#1c1c1e; }
  .m .s { font-size:11.5px; color:#8a8a8a; margin-top:2px; }
  .amt { font-size:14px; font-weight:700; }
  .green { color:#2e9e5b; } .red { color:#e53935; }
  .menu { color:#bdbdbd; display:flex; margin-left:6px; }
  .bottombar { position:absolute; left:0; right:0; bottom:0; height:60px; background:#fff; display:flex; border-top:1px solid #f0f0f0; }
  .navitem { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:#9a9a9a; font-size:10px; }
  .navitem.active { color:#26c6a0; }
  .navitem svg { width:22px; height:22px; }
</style>
</head>
