<!DOCTYPE html>
<html lang="zh-Hant" data-canvas-width="400" data-canvas-height="872">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增分類</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { font-family:'Segoe UI','PingFang TC','Microsoft JhengHei',Roboto,sans-serif; }
  .phone { width:400px; background:#000; border-radius:40px; padding:12px; margin:0 auto; }
  .screen { width:376px; height:848px; background:#F2F2F2; border-radius:30px; overflow:hidden; position:relative; }
  .statusbar { height:26px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 18px; font-size:12px; font-weight:600; color:#1c1c1e; }
  .appbar { height:52px; background:#fff; display:flex; align-items:center; justify-content:center; position:relative; border-bottom:1px solid #f0f0f0; }
  .appbar .title { font-size:18px; font-weight:600; color:#1c1c1e; }
  .appbar .back { position:absolute; left:6px; top:50%; transform:translateY(-50%); width:40px; height:40px; display:flex; align-items:center; justify-content:center; color:#2d2d2d; }
  .body { padding:20px; }
  .preview { width:80px; height:80px; border-radius:18px; background:#ffe0b2; display:flex; align-items:center; justify-content:center; font-size:40px; margin:0 auto; }
  .name { margin-top:16px; border-bottom:1px solid #e0e4e2; padding:8px 2px; font-size:15px; color:#1c1c1e; }
  .count { text-align:right; font-size:11px; color:#b0b0b0; margin-top:2px; }
  .impbtn { margin-top:16px; width:100%; padding:12px; border:1px solid #26c6a0; color:#26c6a0; border-radius:12px; background:#fff; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; }
  .lbl { font-size:14px; font-weight:600; color:#333; margin:18px 0 8px; }
  .icons { display:flex; flex-wrap:wrap; gap:8px; }
  .icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:19px; }
  .icon.on { outline:2px solid #26c6a0; }
  .colors { display:flex; gap:8px; margin-top:6px; }
  .c { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .save { margin-top:24px; width:100%; height:46px; background:#26c6a0; color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:600; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="statusbar"><span>9:41</span><span></span></div>
    <div class="appbar">
      <div class="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></div>
      <span class="title">新增分類</span>
    </div>
    <div class="body">
      <div class="preview">🛍</div>
      <div class="name">購物</div>
      <div class="count">4/20</div>
      <div class="impbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 7v2.99s-1.99.01-2 0V7h-3s.01-1.99 0-2h3V2h2v3h3v2h-3zm-3 4V8h-3V5H3v16h16V11h-3z"/></svg>匯入圖片</div>
      <div class="lbl">選擇內建圖示</div>
      <div class="icons">
        <div class="icon" style="background:#e3f2fd;">🍽</div>
        <div class="icon" style="background:#fdecea;">🥤</div>
        <div class="icon" style="background:#e8f5e9;">🍎</div>
        <div class="icon" style="background:#fdecea;">🏠</div>
        <div class="icon on" style="background:#fff3e0;">🛍</div>
        <div class="icon" style="background:#e0f2f1;">🚌</div>
      </div>
      <div class="lbl">統計顏色</div>
      <div class="colors">
        <div class="c" style="background:#42a5f5;"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
        <div class="c" style="background:#ff9800;"></div>
        <div class="c" style="background:#66bb6a;"></div>
        <div class="c" style="background:#ef5350;"></div>
        <div class="c" style="background:#ab47bc;"></div>
        <div class="c" style="background:#26a69a;"></div>
        <div class="c" style="background:#ec407a;"></div>
        <div class="c" style="background:#8d6e63;"></div>
      </div>
      <button class="save">儲存分類</button>
    </div>
  </div>
</div>
</body>
</html>
