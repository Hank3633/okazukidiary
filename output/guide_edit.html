<!DOCTYPE html>
<html lang="zh-Hant" data-canvas-width="400" data-canvas-height="872">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>編輯紀錄對話框</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { font-family:'Segoe UI','PingFang TC','Microsoft JhengHei',Roboto,sans-serif; }
  .phone { width:400px; background:#000; border-radius:40px; padding:12px; margin:0 auto; }
  .screen { width:376px; height:848px; background:#F2F2F2; border-radius:30px; overflow:hidden; position:relative; }
  .statusbar { height:26px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 18px; font-size:12px; font-weight:600; color:#1c1c1e; }
  .appbar { height:52px; background:#fff; display:flex; align-items:center; justify-content:center; border-bottom:1px solid #f0f0f0; font-size:18px; font-weight:600; color:#1c1c1e; }
  .dim { position:absolute; inset:0; background:rgba(0,0,0,.45); z-index:5; display:flex; align-items:center; justify-content:center; }
  .dlg { width:320px; background:#fff; border-radius:20px; padding:20px; z-index:6; box-shadow:0 12px 40px rgba(0,0,0,.25); }
  .dlg .tt { font-size:18px; font-weight:700; color:#1c1c1e; margin-bottom:16px; }
  .field { border:1px solid #e0e4e2; border-radius:12px; padding:12px; margin-bottom:12px; background:#fafafa; }
  .field .lb { font-size:11px; color:#8a8a8a; margin-bottom:4px; }
  .field .vl { font-size:15px; color:#1c1c1e; display:flex; align-items:center; justify-content:space-between; }
  .field .ch { color:#9aa5a0; }
  .btns { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
  .btn { padding:8px 14px; border-radius:10px; font-size:14px; font-weight:600; }
  .cancel { color:#666; }
  .ok { background:#26c6a0; color:#fff; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="statusbar"><span>9:41</span><span></span></div>
    <div class="appbar">收支統計</div>
    <div class="dim">
      <div class="dlg">
        <div class="tt">編輯紀錄</div>
        <div class="field"><div class="lb">分類</div><div class="vl">餐點<svg class="ch" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></div></div>
        <div class="field"><div class="lb">帳戶</div><div class="vl">現金帳戶<svg class="ch" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></div></div>
        <div class="field"><div class="lb">金額</div><div class="vl">350</div></div>
        <div class="field"><div class="lb">日期</div><div class="vl">2026/10/04<svg class="ch" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></div></div>
        <div class="btns"><span class="btn cancel">取消</span><span class="btn ok">儲存</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
