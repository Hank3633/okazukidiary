<!DOCTYPE html>
<html lang="zh-Hant" data-canvas-width="400" data-canvas-height="872">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帳戶明細</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { font-family:'Segoe UI','PingFang TC','Microsoft JhengHei',Roboto,sans-serif; }
  .phone { width:400px; background:#000; border-radius:40px; padding:12px; margin:0 auto; }
  .screen { width:376px; height:848px; background:#F2F2F2; border-radius:30px; overflow:hidden; position:relative; }
  .statusbar { height:26px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 18px; font-size:12px; font-weight:600; color:#1c1c1e; }
  .appbar { height:52px; background:#fff; display:flex; align-items:center; justify-content:center; position:relative; border-bottom:1px solid #f0f0f0; }
  .appbar .title { font-size:18px; font-weight:600; color:#1c1c1e; }
  .appbar .back { position:absolute; left:6px; top:50%; transform:translateY(-50%); width:40px; height:40px; display:flex; align-items:center; justify-content:center; color:#2d2d2d; }
  .body { padding:14px; }
  .head { background:#fff; border-radius:16px; padding:16px; display:flex; align-items:center; box-shadow:0 1px 2px rgba(20,40,35,.06); }
  .avatar { width:48px; height:48px; border-radius:50%; background:#f5a623; display:flex; align-items:center; justify-content:center; color:#fff; }
  .hi { margin-left:12px; }
  .hi .n { font-size:15px; font-weight:600; color:#1c1c1e; }
  .hi .o { font-size:11.5px; color:#8a8a8a; margin-top:2px; }
  .hbal { margin-left:auto; text-align:right; }
  .hbal .v { font-size:18px; font-weight:800; color:#2e9e5b; }
  .hbal .t { font-size:10px; color:#b0b0b0; margin-top:1px; }
  .divider { height:1px; background:#f0f0f0; }
  .row { display:flex; align-items:center; background:#fff; padding:12px 14px; border-bottom:1px solid #f3f3f3; }
  .li { width:36px; height:36px; border-radius:50%; background:#e6f4ef; display:flex; align-items:center; justify-content:center; color:#26c6a0; flex-shrink:0; }
  .li2 { width:36px; height:36px; border-radius:50%; background:#f6efe6; display:flex; align-items:center; justify-content:center; color:#f5a623; flex-shrink:0; }
  .ci { width:36px; height:36px; border-radius:50%; background:#e3f2fd; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .m { margin-left:11px; flex:1; }
  .m .t { font-size:14px; font-weight:600; color:#1c1c1e; }
  .m .s { font-size:11.5px; color:#8a8a8a; margin-top:2px; }
  .amt { font-size:14px; font-weight:700; }
  .green { color:#2e9e5b; } .red { color:#e53935; } .org { color:#e67e22; }
  .menu { color:#bdbdbd; display:flex; margin-left:6px; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="statusbar"><span>9:41</span><span></span></div>
    <div class="appbar">
      <div class="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></div>
      <span class="title">台新銀行</span>
    </div>
    <div class="body">
      <div class="head">
        <div class="avatar"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M21 7H3c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm0 12H3v-5h4c0 1.66 1.34 3 3 3s3-1.34 3-3h8v5zm0-7h-8c0 1.66-1.34 3-3 3s-3-1.34-3-3H3V9h18v3z"/></svg></div>
        <div class="hi"><div class="n">台新銀行</div><div class="o">起始存款 NT$ 80,000</div></div>
        <div class="hbal"><div class="v">NT$ 96,350</div><div class="t">目前餘額</div></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="li"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6.99 11 3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg></div>
      <div class="m"><div class="t">轉入</div><div class="s">來自 現金帳戶 · 2026/10/03</div></div>
      <div class="amt green">+ NT$ 10,000</div>
      <div class="menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
    </div>
    <div class="row">
      <div class="li2"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16.01 11H4v2h12.01v3L20 12l-3.99-4z"/></svg></div>
      <div class="m"><div class="t">轉出</div><div class="s">轉至 郵局 · 2026/10/02</div></div>
      <div class="amt org">- NT$ 5,000</div>
      <div class="menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
    </div>
    <div class="row">
      <div class="ci" style="background:#e3f2fd;">🍽</div>
      <div class="m"><div class="t">餐點</div><div class="s">2026/10/01</div></div>
      <div class="amt red">- NT$ 350</div>
      <div class="menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
    </div>
    <div class="row">
      <div class="ci" style="background:#e8f5e9;">💰</div>
      <div class="m"><div class="t">薪資</div><div class="s">2026/10/01</div></div>
      <div class="amt green">+ NT$ 30,000</div>
      <div class="menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
    </div>
    <div class="row">
      <div class="ci" style="background:#e0f2f1;">🚌</div>
      <div class="m"><div class="t">交通</div><div class="s">2026/09/30</div></div>
      <div class="amt red">- NT$ 120</div>
      <div class="menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
    </div>
  </div>
</div>
</body>
</html>
